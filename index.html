<style>
:root{
  --bg:#EEF2F6; --surface:#F8FAFC; --ink:#101C2E; --muted:#56637A; --line:#CCD5E0;
  --accent:#1F4BD8; --accent-ink:#FFFFFF; --ok:#12805C;
  --code-bg:#101C2E; --code-ink:#DCE4EF; --code-dim:#7D8BA0; --code-line:#22314A;
  --tk-k:#8FB2FF; --tk-s:#F2C46D; --tk-a:#FF9C7A; --tk-c:#7D8BA0; --tk-t:#9EE6C7;
  --sans:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --maxw:1180px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D1626; --surface:#122036; --ink:#E7ECF3; --muted:#97A3B6; --line:#24344F;
    --accent:#7EA2FF; --accent-ink:#0D1626; --ok:#5FD3A6;
    --code-bg:#070F1C; --code-line:#1C2A42;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1626; --surface:#122036; --ink:#E7ECF3; --muted:#97A3B6; --line:#24344F;
  --accent:#7EA2FF; --accent-ink:#0D1626; --ok:#5FD3A6;
  --code-bg:#070F1C; --code-line:#1C2A42;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-behavior:smooth;scroll-padding-top:calc(72px + env(safe-area-inset-top,0px))}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit}
img{max-width:100%;display:block}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 28px}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar-in{max-width:var(--maxw);margin:0 auto;padding:12px 28px;display:flex;align-items:center;gap:22px}
.me{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:700;font-size:16px;white-space:nowrap}
.me img{width:32px;height:32px;border-radius:50%;object-fit:cover}
.links{display:flex;gap:20px;list-style:none;margin-left:auto;overflow-x:auto;scrollbar-width:none}
.links::-webkit-scrollbar{display:none}
.links a{text-decoration:none;color:var(--muted);font-size:15px;font-weight:500;white-space:nowrap}
.links a:hover,.links a.on{color:var(--ink)}
.ctl{display:flex;gap:8px}
.ctl button{font:600 13px var(--sans);color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:8px;height:34px;min-width:40px;padding:0 10px;cursor:pointer}
.ctl button:hover{border-color:var(--accent);color:var(--accent)}
.ctl svg{width:16px;height:16px;vertical-align:-3px}

/* hero */
.hero{padding:72px 0 88px}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:56px;align-items:start}
.who{display:flex;align-items:center;gap:16px;margin-bottom:30px}
.who img{width:76px;height:76px;border-radius:50%;object-fit:cover;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.who .n{font-size:20px;font-weight:700;line-height:1.2}
.who .r{color:var(--muted);font-size:15px}
.avail{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--ok);font-weight:600;margin-top:4px}
.avail::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.hero h1{font-size:clamp(30px,3.9vw,48px);line-height:1.08;letter-spacing:-.025em;font-weight:800;max-width:20ch}
.hero .lead{margin-top:22px;color:var(--muted);font-size:18px;max-width:52ch}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:32px}
.btn{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-weight:600;font-size:16px;padding:13px 22px;border-radius:10px;border:1.5px solid var(--ink);cursor:pointer;font-family:var(--sans)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:var(--ink);color:var(--bg)}
.btn svg{width:17px;height:17px}

/* code panel: the one bold element */
.code{background:var(--code-bg);color:var(--code-ink);border-radius:18px;overflow:hidden;box-shadow:0 30px 60px -30px rgba(16,28,46,.55)}
.groups{display:flex;border-bottom:1px solid var(--code-line);overflow-x:auto;scrollbar-width:none}
.groups::-webkit-scrollbar{display:none}
.groups button{flex:1 0 auto;white-space:nowrap;background:none;border:0;color:var(--code-dim);font:600 14px var(--sans);padding:14px 10px;cursor:pointer;border-bottom:2px solid transparent}
.groups button[aria-selected="true"]{color:#fff;border-bottom-color:var(--tk-k)}
.variants{display:flex;gap:6px;padding:12px 14px 0;flex-wrap:wrap}
.variants button{background:transparent;color:var(--code-dim);border:1px solid var(--code-line);border-radius:999px;font:500 13px var(--sans);padding:5px 13px;cursor:pointer}
.variants button[aria-pressed="true"]{background:var(--code-ink);color:var(--code-bg);border-color:var(--code-ink)}
.variants button:hover:not([aria-pressed="true"]){color:#fff;border-color:var(--code-dim)}
pre{font-family:var(--mono);font-size:13.5px;line-height:1.7;padding:18px 20px 22px;overflow-x:auto;min-height:290px;tab-size:4}
pre.swap{animation:swap .25s ease}
@keyframes swap{from{opacity:.2;transform:translateY(4px)}to{opacity:1;transform:none}}
.tk-k{color:var(--tk-k)}.tk-s{color:var(--tk-s)}.tk-a{color:var(--tk-a)}.tk-c{color:var(--tk-c);font-style:italic}.tk-t{color:var(--tk-t)}
.cap{color:var(--muted);font-size:14.5px;margin-top:14px}
.pl{margin-top:26px}
.pl-h{font-size:15px;font-weight:700;margin-bottom:10px}
.pl ul{list-style:none;display:flex;flex-wrap:wrap;gap:8px}
.pl li button{font:600 14px var(--sans);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
.pl li button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pl li button:hover:not(.on){border-color:var(--accent);color:var(--accent)}
.pl li span{display:inline-block;font:600 14px var(--sans);color:var(--muted);background:transparent;border:1px dashed var(--line);border-radius:8px;padding:6px 12px}

/* sections: sticky heading left, content right */
.sec{padding:84px 0;border-top:1px solid var(--line)}
.sec-grid{display:grid;grid-template-columns:220px minmax(0,1fr);gap:48px}
.sec h2{font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.15;position:sticky;top:96px;align-self:start}
.prose p{max-width:66ch;color:var(--muted);font-size:18px}
.prose p:first-child{color:var(--ink);font-size:22px;font-weight:600;line-height:1.4;margin-bottom:14px}
.prose p+p{margin-top:12px}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px;margin-top:40px;padding-top:28px;border-top:1px solid var(--line)}
.facts b{display:block;font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1}
.facts span{display:block;color:var(--muted);font-size:15px;margin-top:8px;line-height:1.35}

.job{display:grid;grid-template-columns:170px minmax(0,1fr);gap:28px;padding-bottom:40px}
.job:last-child{padding-bottom:0}
.job .when{color:var(--muted);font-size:15px;padding-top:4px;font-variant-numeric:tabular-nums}
.job .when.cur{color:var(--ok);font-weight:600}
.job h3{font-size:20px;font-weight:700;line-height:1.3}
.job .co{color:var(--accent);font-weight:600;font-size:16px;margin:4px 0 12px}
.job ul{list-style:none;max-width:70ch}
.job li{color:var(--muted);padding-left:20px;position:relative;margin-bottom:8px;font-size:16.5px}
.job li::before{content:"";position:absolute;left:2px;top:.72em;width:8px;height:2px;background:var(--line)}

.proj{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
.pj{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:10px}
.pj.big{grid-column:span 2;border-left:4px solid var(--accent)}
.pj .k{color:var(--muted);font-size:14px;font-weight:500}
.pj h3{font-size:20px;font-weight:700;line-height:1.25}
.pj p{color:var(--muted);font-size:16px;flex:1;max-width:72ch}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{font-size:13px;font-weight:500;padding:3px 10px;border-radius:6px;background:var(--bg);border:1px solid var(--line)}
.pj a{color:var(--accent);font-weight:600;font-size:15px;text-decoration:none;align-self:flex-start}
.pj a:hover{text-decoration:underline}

.stack{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px 40px}
.stack h3{font-size:16px;font-weight:700;margin-bottom:6px}
.stack p{color:var(--muted);font-size:16px}

.certs{display:grid;gap:14px}
.cert{display:flex;align-items:center;gap:18px;padding:20px 22px;background:var(--surface);border:1px solid var(--line);border-radius:14px;text-decoration:none}
.cert:hover{border-color:var(--accent)}
.cert .seal{width:46px;height:46px;border-radius:10px;background:#C74634;flex-shrink:0;display:grid;place-items:center}
.cert .seal svg{width:24px;height:24px;fill:#fff}
.cert h3{font-size:17px;font-weight:700;line-height:1.3}
.cert .d{color:var(--muted);font-size:14.5px}
.cert>span:nth-child(2){min-width:0;flex:1}
.cert .go{margin-left:auto;color:var(--accent);font-weight:600;font-size:14.5px;white-space:nowrap}

.two{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:48px}
.edu div{padding-bottom:22px}
.edu .y{color:var(--muted);font-size:14.5px;font-variant-numeric:tabular-nums}
.edu h3{font-size:17px;font-weight:700;line-height:1.35;margin:2px 0}
.edu p{color:var(--muted);font-size:15.5px}
.langs h3{font-size:16px;font-weight:700;margin-bottom:12px}
.langs dl{display:grid;grid-template-columns:auto 1fr;gap:10px 18px}
.langs dt{font-weight:600}
.langs dd{color:var(--muted)}

.contact-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:48px}
.contact-sub{color:var(--muted);font-size:18px;max-width:46ch}
.clist{list-style:none;margin-top:28px;display:grid;gap:4px}
.clist a{display:flex;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid var(--line);text-decoration:none}
.clist a span:first-child{color:var(--muted)}
.clist a span:last-child{font-weight:600;word-break:break-word;text-align:right}
.clist a:hover span:last-child{color:var(--accent)}
form{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:26px}
form h3{font-size:18px;font-weight:700;margin-bottom:16px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.f{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.f label{font-size:14px;font-weight:600}
.f label i{color:var(--accent);font-style:normal}
.f input,.f textarea{font:16px var(--sans);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 13px;width:100%}
.f textarea{min-height:120px;resize:vertical}
.f input:focus,.f textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.file{display:flex;align-items:center;gap:10px;border:1px dashed var(--line);border-radius:10px;padding:12px 13px;cursor:pointer;color:var(--muted);font-size:14.5px}
.file:hover,.file.has{border-color:var(--accent);color:var(--ink)}
.file input{position:absolute;width:1px;height:1px;opacity:0}
.hp{position:absolute;left:-9999px}
form .btn{width:100%;justify-content:center}
form .btn[disabled]{opacity:.6;cursor:wait}
.status{font-size:14.5px;margin-top:12px;min-height:20px}
.status.ok{color:var(--ok)}.status.err{color:#D2453A}

dialog#certDlg{border:0;padding:0;margin:auto;width:min(920px,94vw);max-height:92vh;max-height:92dvh;border-radius:16px;background:var(--surface);color:var(--ink);box-shadow:0 40px 80px -20px rgba(0,0,0,.6);display:none;flex-direction:column;overflow:hidden}
dialog#certDlg[open]{display:flex;animation:dlgIn .2s ease}
dialog#certDlg::backdrop{background:rgba(7,15,28,.72);backdrop-filter:blur(3px)}
@keyframes dlgIn{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.dlg-head{display:flex;align-items:center;gap:14px;padding:14px 16px 14px 22px;border-bottom:1px solid var(--line)}
.dlg-head h3{font-size:16px;font-weight:700;line-height:1.3;flex:1;min-width:0}
.dlg-head a{color:var(--accent);font-weight:600;font-size:14.5px;text-decoration:none;white-space:nowrap}
.dlg-head a:hover{text-decoration:underline}
.dlg-head button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;display:grid;place-items:center;flex-shrink:0}
.dlg-head button:hover{border-color:var(--accent);color:var(--accent)}
.dlg-body{overflow:auto;padding:18px;background:var(--bg);display:flex;flex-direction:column;align-items:center;gap:14px;min-height:240px}
.dlg-body canvas{width:100%;height:auto;border-radius:6px;box-shadow:0 2px 12px rgba(0,0,0,.18);background:#fff}
.dlg-msg{color:var(--muted);font-size:15px;margin:auto;text-align:center;max-width:40ch}
.dlg-msg a{color:var(--accent);font-weight:600}
@media (max-width:720px){dialog#certDlg{width:100vw;max-width:100vw;max-height:100dvh;height:100dvh;border-radius:0}.dlg-body{padding:10px}.dlg-head{padding-top:calc(14px + env(safe-area-inset-top,0px))}}
@media (prefers-reduced-motion:reduce){dialog#certDlg[open]{animation:none}}
footer{border-top:1px solid var(--line);padding:30px 0;color:var(--muted);font-size:14.5px}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
footer nav{display:flex;gap:18px}
footer a{text-decoration:none}
footer a:hover{color:var(--accent)}

@media (max-width:960px){
  .hero-grid,.contact-grid,.two{grid-template-columns:minmax(0,1fr)}
  .sec-grid{grid-template-columns:minmax(0,1fr);gap:24px}
  .sec h2{position:static}
  .facts{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:720px){
  .links{display:none}
  .ctl{margin-left:auto}
  .wrap,.bar-in{padding-left:20px;padding-right:20px}
  .hero{padding:44px 0 64px}
  .job{grid-template-columns:1fr;gap:6px}
  .proj,.stack{grid-template-columns:1fr}
  .pj.big{grid-column:auto}
  .row{grid-template-columns:1fr}
  .sec{padding:64px 0}
  pre{font-size:12.5px;min-height:0}
  .cert{flex-wrap:wrap}.cert .go{margin-left:64px}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}pre.swap{animation:none}}
</style>
</head>

const PLANGS = ["Java","C#","Python","TypeScript","JavaScript","SQL","PL/SQL","T-SQL","Kotlin","Scala","PHP","VB.NET","C","C++","R","MATLAB"];

/* tiny syntax highlighter */
function hl(code, lang){
  const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const KW = {
    java:"public|private|final|class|return|new|void|static|import",
    csharp:"public|private|class|async|await|return|is|new|string|var",
    python:"async|def|await|if|is|None|raise|return|from|import|class",
    ts:"export|class|private|const|let|return|new|import",
    js:"export|default|function|const|let|return|async|await|null|new|import|if",
    php:"function|return|array|fn|use|new",
    sql:"SELECT|FROM|WHERE|ORDER|BY|IS|NOT|NULL|DESC|CREATE|INDEX|ON|ALTER|TABLE|ADD|CONSTRAINT|FOREIGN|KEY|REFERENCES|AND|OR|REPLACE|PROCEDURE|IN|AS|BEGIN|END|INSERT|INTO|VALUES|COMMIT|EXCEPTION|WHEN|THEN|TOP|CROSS|APPLY|LEFT|JOIN|GROUP|EXPLAIN|ANALYZE|BUFFERS|NUMBER",
    docker:"FROM|WORKDIR|COPY|EXPOSE|HEALTHCHECK|CMD|ENTRYPOINT|RUN",
    yaml:"",
    bash:"export|if|then|fi|for|do|done",
    ps:"if|else|foreach|function",
    kotlin:"data|class|val|var|fun|return",
    scala:"case|class|val|def",
    c:"int|void|for|return|struct|const",
    cpp:"int|void|for|return|struct|const",
    r:"library|function",
    matlab:"function|end|for|if",
    vb:"Public|Function|As|Integer|Using|New|Return|End",
    html:""
  }[lang] || "";
  const hash = ["python","docker","yaml","bash","ps","r"].includes(lang);
  const prep = ["c","cpp"].includes(lang);
  const parts = [
    hash ? "(#[^\\n]*)" : (lang === "matlab" ? "(%[^\\n]*)" : "(--[^\\n]*|//[^\\n]*)"),
    "(\"(?:[^\"\\\\\\n]|\\\\.)*\"|'(?:[^'\\\\\\n]|\\\\.)*'|`(?:[^`\\\\]|\\\\.)*`)",
    prep ? "(#\\w+|@\\w+)" : (lang === "yaml" ? "(^\\s*-?\\s*[\\w-]+(?=:))" : "(@\\w+|\\[\\w+(?=[\\](]))"),
    KW ? "\\b(" + KW + ")\\b" : "(\\$NEVER\\$)",
    ["sql","docker","yaml","bash","html"].includes(lang) ? "(\\$NEVER2\\$)" : "\\b([A-Z][A-Za-z0-9]+)\\b"
  ];
  if (lang === "vb") parts[0] = "('[^\\n]*)";
  const re = new RegExp(parts.join("|"), "gm");
  let out = "", last = 0, m;
  while ((m = re.exec(code))) {
    if (m[0] === "") { re.lastIndex++; continue; }
    out += esc(code.slice(last, m.index));
    const cls = m[1]?"c":m[2]?"s":m[3]?"a":m[4]?"k":"t";
    out += '<span class="tk-'+cls+'">'+esc(m[0])+'</span>';
    last = re.lastIndex;
  }
  return out + esc(code.slice(last));
}

const ALIAS = {"Java":"Spring Boot","C#":"ASP.NET Core","Python":"FastAPI","TypeScript":"Angular","JavaScript":"React","SQL":"Oracle SQL"};
function findSnippet(name){
  const target = ALIAS[name] || name;
  for (const g of Object.keys(SNIPPETS)) { const i = SNIPPETS[g].findIndex(s => s.label === target); if (i > -1) return [g, i]; }
  return null;
}

function renderCode(){
  const t = D[lang];
  $('#groups').innerHTML = Object.keys(SNIPPETS).map(g => `<button role="tab" type="button" data-g="${g}" aria-selected="${g===group}">${t.codeGroups[g]}</button>`).join('');
  const gsel = $('#groups [aria-selected="true"]'); const gbar = $('#groups');
  if (gsel && (gsel.offsetLeft < gbar.scrollLeft || gsel.offsetLeft + gsel.offsetWidth > gbar.scrollLeft + gbar.clientWidth)) gbar.scrollLeft = gsel.offsetLeft - 16;
  const list = SNIPPETS[group];
  $('#variants').innerHTML = list.map((s,i) => `<button type="button" data-v="${i}" aria-pressed="${i===variant}">${s.label}</button>`).join('');
  const out = $('#codeOut'), pre = out.parentElement;
  out.innerHTML = hl(list[variant].code, list[variant].lang);
  document.querySelectorAll('#plList [data-pl]').forEach(b => { const h = findSnippet(b.dataset.pl); const on = !!h && h[0] === group && h[1] === variant; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
  pre.classList.remove('swap'); void pre.offsetWidth; pre.classList.add('swap');
}

/* certificate viewer: renders the PDF on the page with PDF.js */
const PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
let pdfjsReady = null, certToken = 0;
function loadPdfJs(){
  if (!pdfjsReady) pdfjsReady = new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = PDFJS;
    s.onload = () => { window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS.replace('pdf.min.js','pdf.worker.min.js'); res(window.pdfjsLib); };
    s.onerror = () => { pdfjsReady = null; rej(new Error('pdf.js failed to load')); };
    document.head.appendChild(s);
  });
  return pdfjsReady;
}
const dlg = $('#certDlg'), certBody = $('#certBody');
async function openCert(file, name){
  const C = D[lang].cert, token = ++certToken;
  $('#certDlgTitle').textContent = name;
  $('#certClose').setAttribute('aria-label', C.close);
  certBody.innerHTML = `<p class="dlg-msg">${C.loading}</p>`;
  dlg.showModal(); document.body.style.overflow = 'hidden';
  try {
    const lib = await loadPdfJs();
    const pdf = await lib.getDocument(file).promise;
    if (token !== certToken) return;
    certBody.innerHTML = '';
    const width = certBody.clientWidth - 36 > 0 ? Math.min(certBody.clientWidth - 20, 880) : 600;
    const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      if (token !== certToken) return;
      const base = page.getViewport({scale:1});
      const vp = page.getViewport({scale:(width / base.width) * dpr});
      const cv = document.createElement('canvas');
      cv.width = vp.width; cv.height = vp.height;
      cv.setAttribute('role','img'); cv.setAttribute('aria-label', name + (pdf.numPages > 1 ? ' (' + i + '/' + pdf.numPages + ')' : ''));
      certBody.appendChild(cv);
      await page.render({canvasContext: cv.getContext('2d'), viewport: vp}).promise;
    }
  } catch (e) {
    if (token !== certToken) return;
    certBody.innerHTML = `<p class="dlg-msg">${C.error}<br><br><a href="${file}" target="_blank" rel="noopener">${C.open}</a></p>`;
  }
}
function closeCert(){ certToken++; if (dlg.open) dlg.close(); }
dlg.addEventListener('close', () => { document.body.style.overflow = ''; certBody.innerHTML = ''; });
$('#certClose').addEventListener('click', closeCert);
dlg.addEventListener('click', e => { if (e.target === dlg) closeCert(); });
$('#certList').addEventListener('click', e => {
  const a = e.target.closest('.cert'); if (!a || typeof dlg.showModal !== 'function') return;
  e.preventDefault(); openCert(a.dataset.file, a.dataset.name);
});

if (new URLSearchParams(location.search).get('sent') === '1') {

fileIn.addEventListener('change', () => {
  const f = fileIn.files[0], box = $('#fileBox'), txt = $('#fileTxt'), F = D[lang].form;
  box.classList.remove('has'); status.className = 'status'; status.textContent = '';
  if (!f) { txt.textContent = F.filePh; return; }
  const ext = (f.name.split('.').pop() || '').toLowerCase();
  const bad = !['pdf','doc','docx','png','jpg','jpeg','txt','zip'].includes(ext) ? F.badType : f.size > 10*1024*1024 ? F.tooBig : '';
  if (bad) { status.className = 'status err'; status.textContent = bad; fileIn.value = ''; txt.textContent = F.filePh; return; }
  box.classList.add('has'); txt.textContent = f.name + ' (' + (f.size/1048576).toFixed(1) + ' MB)';
});
form.addEventListener('submit', e => {
  if (form._honey.value) { e.preventDefault(); return; }
  if (!form.checkValidity()) { e.preventDefault(); form.reportValidity(); return; }
  const b = $('#sendBtn'); b.disabled = true; b.textContent = D[lang].form.sending;
});
