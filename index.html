<script>try{const t=localStorage.getItem('theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<style>
:root{
  --bg:#E9EEF5; --card:#FFFFFF; --ink:#1B2433; --mut:#5A6577; --line:#E3E8EF; --soft:#F4F7FB;
  --acc:#0A66C2; --acc-ink:#FFFFFF; --acc-soft:#EAF2FB; --acc-text:#0A66C2; --ok:#12805C; --ok-bg:#E3F5EC;
  --cover:linear-gradient(120deg,#0A4E9B 0%,#0A66C2 40%,#2D9CDB 75%,#56CCF2 100%);
  --code-bg:#14191F; --code-ink:#DCE4EF; --code-dim:#7D8BA0; --code-line:#26303B;
  --tk-k:#7FB2FF; --tk-s:#F2C46D; --tk-a:#FF9C7A; --tk-c:#6B7889; --tk-t:#8EE3C2;
  --sans:"Nunito Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:16px; --maxw:1128px; --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px -16px rgba(10,102,194,.25);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1419; --card:#1B2128; --ink:#E6EBF1; --mut:#9AA6B5; --line:#2A323C; --soft:#222932;
  --acc:#4FA3F7; --acc-ink:#0B1520; --acc-soft:#16283B; --acc-text:#71B7FF; --ok:#5FD3A6; --ok-bg:#15302A;
  --cover:linear-gradient(120deg,#0A2F5C 0%,#0B4A8C 45%,#11679E 100%); --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0F1419; --card:#1B2128; --ink:#E6EBF1; --mut:#9AA6B5; --line:#2A323C; --soft:#222932;
  --acc:#4FA3F7; --acc-ink:#0B1520; --acc-soft:#16283B; --acc-text:#71B7FF; --ok:#5FD3A6; --ok-bg:#15302A;
  --cover:linear-gradient(120deg,#0A2F5C 0%,#0B4A8C 45%,#11679E 100%); --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit}img{display:block;max-width:100%}button{font-family:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:6px}
.skip{position:absolute;left:12px;top:-60px;z-index:100;background:var(--acc);color:var(--acc-ink);padding:10px 16px;border-radius:99px;font-weight:700;text-decoration:none}.skip:focus{top:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}

/* cover + floating controls */
.cover{height:220px;background:var(--cover);position:relative;overflow:hidden}
.cover::after{content:"";position:absolute;inset:0;background:
  radial-gradient(600px 220px at 85% 120%,rgba(255,255,255,.22),transparent 60%),
  repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 1px,transparent 1px 64px),
  repeating-linear-gradient(0deg,rgba(255,255,255,.05) 0 1px,transparent 1px 64px)}
.cover-in{position:relative;z-index:1;max-width:var(--maxw);margin:0 auto;padding:16px 20px;display:flex;justify-content:flex-end;gap:8px}
.cover-in button{height:38px;min-width:38px;padding:0 12px;border-radius:99px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.14);color:#fff;font:700 13.5px var(--sans);cursor:pointer;backdrop-filter:blur(8px);display:inline-flex;align-items:center;justify-content:center}
.cover-in button:hover{background:rgba(255,255,255,.26)}
.cover-in svg{width:18px;height:18px}

/* profile header */
.profile{margin-top:-110px;position:relative;z-index:2;border-radius:var(--r) var(--r) 0 0;border-bottom:0;box-shadow:none}
.ph{display:grid;grid-template-columns:auto 1fr auto;gap:26px;align-items:end;padding:0 32px 26px}
.avatar{width:168px;height:168px;border-radius:50%;object-fit:cover;border:6px solid var(--card);margin-top:-56px;box-shadow:0 8px 20px rgba(0,0,0,.18);background:var(--line)}
.ph h1{font-size:clamp(28px,3.4vw,36px);font-weight:800;letter-spacing:-.02em;line-height:1.15;margin-top:18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.verified{width:22px;height:22px;color:var(--acc)}
.headline{color:var(--ink);font-size:17px;margin-top:4px}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:14.5px;color:var(--mut)}
.meta .reloc{color:var(--ok);font-weight:700}
.meta a{color:var(--acc-text);font-weight:700;text-decoration:none}
.meta a:hover{text-decoration:underline}
.open{display:inline-flex;align-items:center;gap:7px;margin-top:12px;background:var(--ok-bg);color:var(--ok);font-weight:700;font-size:13.5px;padding:5px 12px;border-radius:99px}
.open::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.acts{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 20px;border-radius:99px;font:700 15px var(--sans);text-decoration:none;border:2px solid var(--acc);color:var(--acc-text);background:transparent;cursor:pointer;white-space:nowrap}
.btn.pri{background:var(--acc);color:var(--acc-ink)}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{border-color:var(--line);color:var(--ink)}
.btn svg{width:17px;height:17px}

/* tabs */
.tabs{position:sticky;top:0;z-index:40;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:0 0 var(--r) var(--r);display:flex;gap:2px;padding:0 20px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{padding:15px 14px 13px;font-weight:700;color:var(--mut);text-decoration:none;border-bottom:3px solid transparent;white-space:nowrap;font-size:15px}
.tabs a:hover{color:var(--ink)}
.tabs a.on{color:var(--acc-text);border-bottom-color:var(--acc)}
.tabs.stuck{border-radius:0;box-shadow:0 6px 16px -10px rgba(0,0,0,.25)}

/* body */
.layout{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;margin:20px auto 40px;align-items:start}
.main{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;min-width:0}
.side{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;position:sticky;top:72px}
.sec{padding:24px 28px}
.sec>h2{font-size:21px;font-weight:800;letter-spacing:-.01em;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.sec>h2 small{font-size:14px;font-weight:600;color:var(--mut)}
.about p{color:var(--ink);line-height:1.65}
.about p+p{margin-top:10px;color:var(--mut)}

/* experience */
.xp{display:grid;grid-template-columns:52px 1fr;gap:16px;padding:18px 0;border-top:1px solid var(--line)}
.xp:first-of-type{border-top:0;padding-top:4px}
.logo{width:52px;height:52px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:17px;color:#fff;letter-spacing:-.02em}
.xp h3{font-size:17px;font-weight:800;line-height:1.3}
.xp .co{font-size:15px}
.xp .when{font-size:14px;color:var(--mut);margin-top:1px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cur{color:var(--ok);font-weight:700}
.chip{font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--acc-soft);color:var(--acc-text)}
.xp ul{list-style:none;margin-top:10px;display:grid;gap:6px}
.xp li{padding-left:16px;position:relative;color:var(--mut);font-size:15px}
.xp li::before{content:"";position:absolute;left:2px;top:.65em;width:6px;height:6px;border-radius:50%;background:var(--line)}
.xp.closed li:nth-child(n+3){display:none}
.more{background:none;border:0;color:var(--acc-text);font:700 14px var(--sans);cursor:pointer;margin-top:8px;padding:0}
.more:hover{text-decoration:underline}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tags span{font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--soft);color:var(--mut);border:1px solid var(--line)}

/* projects */
.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.pj{border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:8px;text-decoration:none;transition:border-color .15s,transform .15s;background:var(--card)}
a.pj:hover{border-color:var(--acc);transform:translateY(-2px)}
.pj.feat{grid-column:span 2;background:linear-gradient(135deg,var(--acc-soft),var(--card) 70%)}
.pj .k{font-size:12.5px;font-weight:700;color:var(--acc-text);text-transform:uppercase;letter-spacing:.06em}
.pj h3{font-size:17px;font-weight:800;line-height:1.3}
.pj p{color:var(--mut);font-size:14.5px;flex:1}
.pj .go{font-weight:700;color:var(--acc-text);font-size:14px}

/* skills */
.filter{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.filter input{flex:1;max-width:360px;font:15px var(--sans);color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:99px;padding:9px 16px}
.filter input:focus{outline:none;border-color:var(--acc)}
.filter span{font-size:14px;color:var(--mut)}
.skg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 26px}
.skg h3{font-size:15px;font-weight:800;margin-bottom:8px}
.skg ul{list-style:none;display:flex;flex-wrap:wrap;gap:6px}
.skg li{font-size:13.5px;font-weight:600;padding:4px 11px;border-radius:99px;background:var(--acc-soft);color:var(--acc-text)}
.skg li.hit{background:var(--acc);color:var(--acc-ink)}
.skg .dim{opacity:.35}

/* code panel */
.code{background:var(--code-bg);color:var(--code-ink);border-radius:14px;overflow:hidden;margin-top:20px}
.code-top{display:flex;align-items:center;gap:7px;padding:12px 16px 0}
.code-top i{width:11px;height:11px;border-radius:50%;background:#2E3946}
.code-top span{margin-left:auto;font:500 12.5px var(--mono);color:var(--code-dim)}
.groups{display:flex;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--code-line);padding:0 8px}
.groups::-webkit-scrollbar{display:none}
.groups button{flex:0 0 auto;background:none;border:0;color:var(--code-dim);font:700 14px var(--sans);padding:12px 11px;cursor:pointer;border-bottom:2px solid transparent}
.groups button[aria-selected="true"]{color:#fff;border-bottom-color:var(--tk-k)}
.variants{display:flex;gap:6px;padding:12px 14px 0;flex-wrap:wrap}
.variants button{background:transparent;color:var(--code-dim);border:1px solid var(--code-line);border-radius:99px;font:600 13px var(--sans);padding:4px 12px;cursor:pointer}
.variants button[aria-pressed="true"]{background:var(--code-ink);color:var(--code-bg);border-color:var(--code-ink)}
.pre-wrap{position:relative}
pre{font-family:var(--mono);font-size:13.5px;line-height:1.7;padding:16px 20px 20px;overflow-x:auto;min-height:250px;tab-size:4}
pre.swap{animation:swap .25s ease}
@keyframes swap{from{opacity:.2;transform:translateY(4px)}to{opacity:1;transform:none}}
.cpy{position:absolute;top:10px;right:12px;background:rgba(255,255,255,.06);border:1px solid var(--code-line);color:var(--code-dim);border-radius:8px;font:600 12px var(--sans);padding:4px 10px;cursor:pointer}
.cpy:hover{color:#fff}
.tk-k{color:var(--tk-k)}.tk-s{color:var(--tk-s)}.tk-a{color:var(--tk-a)}.tk-c{color:var(--tk-c);font-style:italic}.tk-t{color:var(--tk-t)}

/* certs + education */
.cert{display:flex;gap:14px;align-items:center;width:100%;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:inherit;font:inherit;text-align:left;cursor:pointer;margin-top:10px}
.cert:first-of-type{margin-top:0}
.cert:hover{border-color:var(--acc)}
.seal{width:46px;height:46px;border-radius:10px;background:#C74634;flex-shrink:0;display:grid;place-items:center}
.seal svg{width:24px;height:24px;fill:#fff}
.cert b{display:block;font-size:15.5px;line-height:1.3}
.cert small{color:var(--mut);font-size:13.5px}
.cert .go{margin-left:auto;color:var(--acc-text);font-weight:700;font-size:14px;white-space:nowrap}
.ed{display:grid;grid-template-columns:52px 1fr;gap:16px;padding:14px 0;border-top:1px solid var(--line)}
.ed:first-of-type{border-top:0;padding-top:0}
.ed .logo{background:var(--acc-soft);color:var(--acc-text);font-size:22px}
.ed b{display:block;font-size:16px;line-height:1.3}
.ed span{color:var(--mut);font-size:14.5px;display:block}

/* sidebar */
.side .sec{padding:20px 22px}
.side h2{font-size:17px;margin-bottom:12px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stats div{background:var(--soft);border-radius:12px;padding:12px}
.stats b{font-size:26px;font-weight:800;color:var(--acc-text);line-height:1;display:block}
.stats span{font-size:13px;color:var(--mut);line-height:1.3;display:block;margin-top:4px}
.lg{margin-top:10px}.lg:first-of-type{margin-top:0}
.lg-top{display:flex;justify-content:space-between;font-size:14.5px}
.lg-top span{color:var(--mut)}
.meter{height:6px;border-radius:99px;background:var(--soft);margin-top:5px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--acc);border-radius:99px}
.clink{display:flex;align-items:center;gap:12px;padding:9px 0;text-decoration:none;border-top:1px solid var(--line);font-size:14.5px;min-width:0}
.clink:first-of-type{border-top:0}
.clink svg{width:18px;height:18px;color:var(--acc-text);flex-shrink:0}
.clink span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.clink:hover span{color:var(--acc-text)}
.opento{display:flex;flex-wrap:wrap;gap:6px}
.opento span{font-size:13.5px;font-weight:700;padding:5px 11px;border-radius:99px;border:1px solid var(--line)}

/* contact form */
.cgrid{display:grid;grid-template-columns:1fr;gap:0}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.f label,.f .fl{font-size:14px;font-weight:700}
.f label i{color:#D2453A;font-style:normal}
.f input,.f textarea{font:15.5px var(--sans);color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:10px 13px;width:100%}
.f textarea{min-height:120px;resize:vertical}
.f input:focus,.f textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 20%,transparent)}
.f [aria-invalid="true"]{border-color:#D2453A}
.file{display:flex;align-items:center;gap:10px;border:1px dashed var(--line);border-radius:10px;padding:11px 13px;cursor:pointer;color:var(--mut);font-size:14.5px;position:relative}
.file:hover,.file.has{border-color:var(--acc);color:var(--ink)}
.file input{position:absolute;width:1px;height:1px;opacity:0}
.hp{position:absolute;left:-9999px}
form .btn{width:100%}
form .btn[disabled]{opacity:.6;cursor:wait}
.status{font-size:14.5px;margin-top:10px;min-height:20px}
.status.ok{color:var(--ok)}.status.err{color:#D2453A}
.csub{color:var(--mut);margin:-4px 0 16px}

/* dialog */
dialog#certDlg{border:0;padding:0;margin:auto;width:min(920px,94vw);max-height:92dvh;border-radius:var(--r);background:var(--card);color:var(--ink);box-shadow:0 40px 80px -20px rgba(0,0,0,.6);display:none;flex-direction:column;overflow:hidden}
dialog#certDlg[open]{display:flex;animation:dlgIn .2s ease}
dialog#certDlg::backdrop{background:rgba(8,14,24,.7);backdrop-filter:blur(3px)}
@keyframes dlgIn{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.dlg-head{display:flex;align-items:center;gap:14px;padding:14px 16px 14px 22px;border-bottom:1px solid var(--line)}
.dlg-head h3{font-size:16px;line-height:1.3;flex:1;min-width:0}
.dlg-head a{font-weight:700;color:var(--acc-text);font-size:14.5px;text-decoration:none;white-space:nowrap}
.dlg-head button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;display:grid;place-items:center;flex-shrink:0}
.dlg-body{overflow:auto;padding:18px;background:var(--bg);display:flex;flex-direction:column;align-items:center;gap:14px;min-height:240px}
.dlg-body canvas{width:100%;height:auto;border-radius:6px;box-shadow:0 2px 12px rgba(0,0,0,.18);background:#fff}
.dlg-msg{color:var(--mut);margin:auto;text-align:center;max-width:40ch}
.dlg-msg a{color:var(--acc-text);font-weight:700}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--card);padding:10px 18px;border-radius:99px;font-size:14.5px;font-weight:700;opacity:0;pointer-events:none;transition:.2s;z-index:120}
.toast.show{opacity:1;transform:translate(-50%,0)}
.top{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);display:grid;place-items:center;cursor:pointer;opacity:0;pointer-events:none;transition:.2s;z-index:40;box-shadow:var(--shadow)}
.top.show{opacity:1;pointer-events:auto}
footer{padding:10px 0 40px;color:var(--mut);font-size:14px}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
footer nav{display:flex;gap:16px;flex-wrap:wrap}
footer a{text-decoration:none}footer a:hover{color:var(--acc-text)}

.js .rv{opacity:0;transform:translateY(12px);transition:opacity .45s ease,transform .45s ease}
.js .rv.in{opacity:1;transform:none}

@media (max-width:980px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .side{position:static;grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:760px){
  .cover{height:150px}
  .profile{margin-top:-64px}
  .wrap{padding:0 12px}
  .ph{grid-template-columns:1fr;justify-items:center;text-align:center;padding:0 18px 22px;gap:12px}
  .ph h1{justify-content:center;margin-top:6px}

/* ===================== SYNTAX HIGHLIGHTER ===================== */
function hl(code, lang){
  const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const KW = {
    java:"public|private|final|class|return|new|void|static|import",
    csharp:"public|private|class|async|await|return|is|new|string|var",
    python:"async|def|await|if|is|None|raise|return|from|import|class|print",
    ts:"export|class|private|const|let|return|new|import",
    js:"export|default|function|const|let|return|async|await|null|new|import|if",
    php:"function|return|array|fn|use|new|class|extends|public",
    dart:"class|const|super|required|final|extends|return|override",
    sql:"SELECT|FROM|WHERE|ORDER|BY|IS|NOT|NULL|DESC|CREATE|INDEX|ON|ALTER|TABLE|ADD|CONSTRAINT|FOREIGN|KEY|REFERENCES|AND|OR|REPLACE|PROCEDURE|IN|AS|BEGIN|END|INSERT|INTO|VALUES|COMMIT|EXCEPTION|WHEN|THEN|TOP|CROSS|APPLY|LEFT|JOIN|GROUP|EXPLAIN|ANALYZE|BUFFERS|NUMBER",
    docker:"FROM|WORKDIR|COPY|EXPOSE|HEALTHCHECK|CMD|ENTRYPOINT|RUN",
    bash:"export|if|then|fi|for|do|done",
    ps:"if|else|foreach|function",
    kotlin:"data|class|val|var|fun|return",
    scala:"case|class|val|def",
    c:"int|void|for|return|struct|const",
    cpp:"int|void|for|return|struct|const",
    r:"library|function",
    matlab:"function|end|for|if",
    vb:"Public|Function|As|Integer|Using|New|Return|End"
  }[lang] || "";
  const hash = ["python","docker","yaml","bash","ps","r"].includes(lang);
  const prep = ["c","cpp"].includes(lang);
  const parts = [
    lang === "vb" ? "('[^\\n]*)" : hash ? "(#[^\\n]*)" : lang === "matlab" ? "(%[^\\n]*)" : "(--[^\\n]*|//[^\\n]*)",
    "(\"(?:[^\"\\\\\\n]|\\\\.)*\"|'(?:[^'\\\\\\n]|\\\\.)*'|`(?:[^`\\\\]|\\\\.)*`)",
    prep ? "(#\\w+|@\\w+)" : lang === "yaml" ? "(^\\s*-?\\s*[\\w-]+(?=:))" : "(@\\w+|\\[\\w+(?=[\\](]))",
    KW ? "\\b(" + KW + ")\\b" : "(\\$NEVER\\$)",
    ["sql","docker","yaml","bash","html"].includes(lang) ? "(\\$NEVER2\\$)" : "\\b([A-Z][A-Za-z0-9]+)\\b"
  ];
  const re = new RegExp(parts.join("|"), "gm");
  let out = "", last = 0, m;
  while ((m = re.exec(code))) {
    if (m[0] === "") { re.lastIndex++; continue; }
    out += esc(code.slice(last, m.index));
    const cls = m[1]?"c":m[2]?"s":m[3]?"a":m[4]?"k":"t";
    out += '<span class="tk-'+cls+'">'+esc(m[0])+'</span>';
    last = re.lastIndex;
  }
  return out + esc(code.slice(last));
}

  $('#aboutBody').innerHTML = t.about.map(p => `<p>${esc(p)}</p>`).join('');

  /* experience */
  $('#workCount').textContent = x.positions(t.work.length);
  $('#jobs').innerHTML = t.work.map((j,i) => {
    const [lt, lc] = logoOf(j.co);
    const closed = !openJobs.has(i) && j.items.length > 2;
    return `<article class="xp${closed ? ' closed' : ''}"><div class="logo" style="background:${lc}" aria-hidden="true">${lt}</div><div>
      <h3>${esc(j.role)}</h3><div class="co">${esc(j.co)}</div>
      <div class="when">${j.cur ? `<span class="cur">● ${x.present}</span>` : ''}<span>${esc(j.when)}</span>${j.intern ? `<span class="chip">${t.internship}</span>` : ''}</div>
      <ul>${j.items.map(it => `<li>${esc(it)}</li>`).join('')}</ul>
      ${j.items.length > 2 ? `<button class="more" type="button" data-job="${i}" aria-expanded="${!closed}">${closed ? x.more : x.less}</button>` : ''}
      <div class="tags">${(j.tags||[]).map(g => `<span>${esc(g)}</span>`).join('')}</div></div></article>`;
  }).join('');

  /* projects */
  $('#proj').innerHTML = t.projects.map((p,i) => {
    const tag = p.link ? 'a' : 'div', attrs = p.link ? ` href="${p.link}" target="_blank" rel="noopener"` : '';
    return `<${tag} class="pj${i === 0 ? ' feat' : ''}"${attrs}><span class="k">${esc(p.kind)}</span><h3>${esc(p.name)}</h3><p>${esc(p.text)}</p><div class="tags">${p.tags.map(g => `<span>${esc(g)}</span>`).join('')}</div>${p.link ? `<span class="go">${x.viewCode}</span>` : ''}</${tag}>`;
  }).join('');

  renderStack();

  /* certs + education */
  $('#certList').innerHTML = t.certs.map(c => `<button class="cert" type="button" data-file="${c.file}" data-name="${esc(c.name)}">${SEAL}<span><b>${esc(c.name)}</b><small>Oracle University · ${esc(c.date)}</small></span><span class="go">${t.certView} →</span></button>`).join('');
  $('#eduList').innerHTML = t.edu.map(e => `<div class="ed"><div class="logo" aria-hidden="true">🎓</div><div><b>${esc(e.name)}</b><span>${esc(e.sc)}</span><span>${esc(e.yr)}</span></div></div>`).join('');

  /* sidebar */
  $('#hlTitle').textContent = x.highlights;
  $('#stats').innerHTML = t.stats.map(([n,l]) => `<div><b>${n}</b><span>${esc(l)}</span></div>`).join('');
  $('#openTitle').textContent = x.openTo;
  $('#openList').innerHTML = x.openList.map(o => `<span>${esc(o)}</span>`).join('');
  $('#langList').innerHTML = t.langs.map(([a,b,p]) => `<div class="lg"><div class="lg-top"><b>${esc(a)}</b><span>${esc(b)}</span></div><div class="meter" role="img" aria-label="${esc(a)}: ${esc(b)}"><i style="width:${p}%"></i></div></div>`).join('');
  $('#ciTitle').textContent = x.contactInfo;
  $('#clist').innerHTML = [
    ['email', CONTACT.email, 'mailto:'+CONTACT.email],
    ['phone', CONTACT.phone, 'tel:'+CONTACT.tel],
    ['whatsapp', 'WhatsApp', CONTACT.whatsapp],
    ['linkedin', 'linkedin.com/in/issam-serbout', CONTACT.linkedin],
    ['github', 'github.com/issamserbout', CONTACT.github],
    ['location', t.location, 'https://maps.google.com/?q=Tangier,Morocco']
  ].map(([k,v,h]) => `<a class="clink" href="${h}"${h.startsWith('http') ? ' target="_blank" rel="noopener"' : ''}>${ICON[k]}<span>${esc(v)}</span></a>`).join('');

  renderCode(false);
  observeReveal();
  markNav();
}

function renderStack(){
  const t = D[lang], q = skillQ.trim().toLowerCase();
  let hits = 0;
  $('#stackBody').innerHTML = t.stack.map(([h,v]) => {
    const items = v.split(/,\s*(?![^()]*\))/);
    let any = false;
    const lis = items.map(s => { const m = q && s.toLowerCase().includes(q); if (m) { any = true; hits++; } return `<li${m ? ' class="hit"' : ''}>${esc(s)}</li>`; }).join('');
    return `<div${q && !any ? ' class="dim"' : ''}><h3>${esc(h)}</h3><ul>${lis}</ul></div>`;
  }).join('');
  $('#skillCount').textContent = q ? t.matches(hits) : '';
}

function renderCode(anim = true){
  const t = D[lang], groups = Object.keys(SNIPPETS);
  $('#groups').innerHTML = groups.map(g => `<button role="tab" type="button" id="tab-${g}" data-g="${g}" aria-controls="codePanel" aria-selected="${g===group}" tabindex="${g===group?0:-1}">${t.codeGroups[g]}</button>`).join('');
  $('#codePanel').setAttribute('aria-labelledby', 'tab-' + group);
  const list = SNIPPETS[group], s = list[variant];
  $('#variants').innerHTML = list.map((v,i) => `<button type="button" data-v="${i}" aria-pressed="${i===variant}">${v.label}</button>`).join('');
  $('#fileName').textContent = s.file;
  const out = $('#codeOut'), pre = out.parentElement;
  out.innerHTML = hl(s.code, s.lang);
  if (anim) { pre.classList.remove('swap'); void pre.offsetWidth; pre.classList.add('swap'); }
}

/* events */
$('#groups').addEventListener('click', e => { const b = e.target.closest('[data-g]'); if (!b) return; group = b.dataset.g; variant = 0; renderCode(); });
$('#groups').addEventListener('keydown', e => {
  const keys = Object.keys(SNIPPETS); let i = keys.indexOf(group);
  if (e.key === 'ArrowRight') i = (i + 1) % keys.length; else if (e.key === 'ArrowLeft') i = (i - 1 + keys.length) % keys.length;
  else if (e.key === 'Home') i = 0; else if (e.key === 'End') i = keys.length - 1; else return;
  e.preventDefault(); group = keys[i]; variant = 0; renderCode(); $('#groups [aria-selected="true"]').focus();
});
$('#variants').addEventListener('click', e => { const b = e.target.closest('[data-v]'); if (!b) return; variant = +b.dataset.v; renderCode(); });
$('#cpyCode').addEventListener('click', () => copyText(SNIPPETS[group][variant].code, D[lang].codeCopied));
$('#skillQ').addEventListener('input', e => { skillQ = e.target.value; renderStack(); });
$('#jobs').addEventListener('click', e => {
  const b = e.target.closest('[data-job]'); if (!b) return;
  const i = +b.dataset.job, x = X[lang], card = b.closest('.xp');
  const open = card.classList.toggle('closed') === false;
  open ? openJobs.add(i) : openJobs.delete(i);
  b.setAttribute('aria-expanded', open); b.textContent = open ? x.less : x.more;
});
$('#langBtn').addEventListener('click', () => {
  lang = lang === 'en' ? 'es' : 'en';
  try { localStorage.setItem('lang', lang); } catch(e) {}
  const u = new URL(location); u.searchParams.set('lang', lang); history.replaceState(null, '', u);
  render();
});
$('#themeBtn').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('theme', next); } catch(e) {}
});
$('#cvLink').href = CONTACT.cv;
$('#fGit').href = CONTACT.github; $('#fIn').href = CONTACT.linkedin; $('#fWa').href = CONTACT.whatsapp;

/* sticky tabs: active section + shadow when stuck */
let navCur = '';
const navIO = new IntersectionObserver(es => es.forEach(en => { if (en.isIntersecting) { navCur = en.target.id; markNav(); } }), {rootMargin:'-35% 0px -60% 0px'});
SECTIONS.forEach(id => navIO.observe(document.getElementById(id)));
function markNav(){
  $$('#tabs a').forEach(a => {
    const on = a.getAttribute('href') === '#' + navCur;
    a.classList.toggle('on', on); on ? a.setAttribute('aria-current','true') : a.removeAttribute('aria-current');
    if (on) { const bar = $('#tabs'); if (a.offsetLeft < bar.scrollLeft || a.offsetLeft + a.offsetWidth > bar.scrollLeft + bar.clientWidth) bar.scrollTo({left:a.offsetLeft - 20, behavior: reduced ? 'auto' : 'smooth'}); }
  });
}
const tabs = $('#tabs'), toTop = $('#toTop');
addEventListener('scroll', () => {
  tabs.classList.toggle('stuck', tabs.getBoundingClientRect().top <= 0 && scrollY > 200);
  toTop.classList.toggle('show', scrollY > 900);
}, {passive:true});
toTop.addEventListener('click', () => scrollTo({top:0, behavior: reduced ? 'auto' : 'smooth'}));

const revIO = 'IntersectionObserver' in window ? new IntersectionObserver(es => es.forEach(en => { if (en.isIntersecting) { en.target.classList.add('in'); revIO.unobserve(en.target); } }), {rootMargin:'0px 0px -6% 0px'}) : null;
function observeReveal(){ $$('.rv:not(.in)').forEach(el => revIO ? revIO.observe(el) : el.classList.add('in')); }

/* certificate viewer */
const PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
let pdfjsReady = null, certToken = 0;
function loadPdfJs(){
  if (!pdfjsReady) pdfjsReady = new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = PDFJS;
    s.onload = () => { window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS.replace('pdf.min.js','pdf.worker.min.js'); res(window.pdfjsLib); };
    s.onerror = () => { pdfjsReady = null; rej(new Error('pdf.js failed')); };
    document.head.appendChild(s);
  });
  return pdfjsReady;
}
const dlg = $('#certDlg'), certBody = $('#certBody');
async function openCert(file, name){
  const C = D[lang].cert, token = ++certToken;
  if (typeof dlg.showModal !== 'function') { window.open(file, '_blank'); return; }
  $('#certDlgTitle').textContent = name;
  $('#certOpen').textContent = C.open; $('#certOpen').href = file;
  $('#certClose').setAttribute('aria-label', C.close);
  certBody.innerHTML = `<p class="dlg-msg">${C.loading}</p>`;
  dlg.showModal(); document.body.style.overflow = 'hidden';
  try {
    const lib = await loadPdfJs();
    const pdf = await lib.getDocument(file).promise;
    if (token !== certToken) return;
    certBody.innerHTML = '';
    const width = Math.min(Math.max(certBody.clientWidth - 20, 280), 880);
    const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      if (token !== certToken) return;
      const vp = page.getViewport({scale:(width / page.getViewport({scale:1}).width) * dpr});
      const cv = document.createElement('canvas'); cv.width = vp.width; cv.height = vp.height;
      cv.setAttribute('role','img'); cv.setAttribute('aria-label', name);
      certBody.appendChild(cv);
      await page.render({canvasContext: cv.getContext('2d'), viewport: vp}).promise;
    }
  } catch (e) {
    if (token !== certToken) return;
    certBody.innerHTML = `<p class="dlg-msg">${C.error}<br><br><a href="${file}" target="_blank" rel="noopener">${C.open}</a></p>`;
  }
}
function closeCert(){ certToken++; if (dlg.open) dlg.close(); }
dlg.addEventListener('close', () => { document.body.style.overflow = ''; certBody.innerHTML = ''; });
$('#certClose').addEventListener('click', closeCert);
dlg.addEventListener('click', e => { if (e.target === dlg) closeCert(); });
$('#certList').addEventListener('click', e => { const b = e.target.closest('.cert'); if (b) openCert(b.dataset.file, b.dataset.name); });

/* contact form */
const form = $('#cform'), status = $('#status'), fileIn = $('#fileIn');
if (new URLSearchParams(location.search).get('sent') === '1') {
  status.className = 'status ok'; status.textContent = D[lang].form.sent;
  const u = new URL(location); u.searchParams.delete('sent'); history.replaceState(null, '', u.pathname + u.search + '#contact');
}
fileIn.addEventListener('change', () => {
  const f = fileIn.files[0], box = $('#fileBox'), txt = $('#fileTxt'), F = D[lang].form;
  box.classList.remove('has'); status.className = 'status'; status.textContent = '';
  if (!f) { txt.textContent = F.filePh; return; }
  const ext = (f.name.split('.').pop() || '').toLowerCase();
  const bad = !['pdf','doc','docx','png','jpg','jpeg','txt','zip'].includes(ext) ? F.badType : f.size > 10*1024*1024 ? F.tooBig : '';
  if (bad) { status.className = 'status err'; status.textContent = bad; fileIn.value = ''; txt.textContent = F.filePh; return; }
  box.classList.add('has'); txt.textContent = f.name + ' (' + (f.size/1048576).toFixed(1) + ' MB)';
});
form.querySelectorAll('[required]').forEach(el => el.addEventListener('input', () => el.removeAttribute('aria-invalid')));
form.addEventListener('submit', e => {
  if (form._honey.value) { e.preventDefault(); return; }
  if (!form.checkValidity()) {
    e.preventDefault();
    form.querySelectorAll('[required]').forEach(el => el.setAttribute('aria-invalid', !el.checkValidity()));
    status.className = 'status err'; status.textContent = D[lang].form.invalid;
    form.querySelector(':invalid')?.focus(); return;
  }
  const b = $('#sendBtn'); b.disabled = true; b.textContent = D[lang].form.sending;
});
addEventListener('pageshow', () => { const b = $('#sendBtn'); b.disabled = false; b.textContent = D[lang].form.send; });

render();
</script>
</body>
