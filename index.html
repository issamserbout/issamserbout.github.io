<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Issam Serbout — Full-Stack Engineer (Java, .NET, Python)</title>
<meta name="description" content="Issam Serbout, full-stack engineer in Java/Spring Boot, C#/ASP.NET Core and Python, with Angular, React and Vue. Oracle-certified database engineer. Tangier, open to remote and relocation.">
<meta property="og:title" content="Issam Serbout — Full-Stack Engineer">
<meta property="og:description" content="Full-stack in Java, .NET and Python. Angular, React, Vue. Oracle and SQL Server in production. Open to remote and relocation.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://issamserbout.github.io/">
<meta name="twitter:card" content="summary">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230E1116'/%3E%3Ctext x='32' y='44' font-family='monospace' font-size='30' font-weight='700' fill='%2338BDF8' text-anchor='middle'%3Eis%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0E1116; --bg2:#0B0E12; --panel:#161A21; --panel2:#1B2028;
  --line:#232A34; --line2:#2C333F;
  --text:#E6E8EB; --muted:#8B94A3; --dim:#5B6472;
  --accent:#38BDF8; --accent2:#6ACFFA; --glow:rgba(56,189,248,.18); --on-accent:#08131F;
  --ok:#5FE3A1; --oracle:#C74634; --nav-bg:rgba(11,14,18,.82);
  --dsp:"Space Grotesk",sans-serif; --body:"Inter",sans-serif; --mono:"JetBrains Mono",monospace;
  --maxw:1160px;
}
html[data-theme="light"]{
  --bg:#F7F8FA; --bg2:#EDF0F4; --panel:#FFFFFF; --panel2:#F3F5F8;
  --line:#E4E8ED; --line2:#D4DAE1;
  --text:#141821; --muted:#5B6472; --dim:#7A8494;
  --accent:#0B82C4; --accent2:#1093D6; --glow:rgba(11,130,196,.13); --on-accent:#FFFFFF;
  --ok:#1FA971; --nav-bg:rgba(247,248,250,.86);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:70px}
body{font-family:var(--body);background:var(--bg);color:var(--text);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:hidden;transition:background-color .3s,color .3s;padding-bottom:env(safe-area-inset-bottom,0px)}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
::selection{background:var(--accent);color:var(--on-accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 28px}
.eyebrow{font-family:var(--mono);font-size:12.5px;font-weight:500;letter-spacing:.08em;color:var(--accent);text-transform:uppercase;margin-bottom:18px;display:flex;align-items:center;gap:10px}
.eyebrow::before{content:"//";color:var(--dim)}
h1,h2,h3{font-family:var(--dsp);font-weight:600;letter-spacing:-.02em;line-height:1.08}
section{padding:104px 0;position:relative}
.sec-head{margin-bottom:48px;max-width:640px}
.sec-head h2{font-size:clamp(28px,4vw,40px)}
.sec-head p{color:var(--muted);margin-top:14px;font-size:16.5px}
.alt{background:var(--bg2)}

.btn{display:inline-flex;align-items:center;gap:9px;font-family:var(--mono);font-weight:500;font-size:14px;padding:13px 22px;border-radius:10px;cursor:pointer;transition:transform .18s,background .18s,border-color .18s,box-shadow .18s;border:1px solid transparent}
.btn svg{width:16px;height:16px}
.btn-a{background:var(--accent);color:var(--on-accent);font-weight:600}
.btn-a:hover{background:var(--accent2);transform:translateY(-2px);box-shadow:0 12px 28px var(--glow)}
.btn-b{border-color:var(--line2);color:var(--text)}
.btn-b:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-2px)}

/* nav */
.nav{position:fixed;inset:0 0 auto 0;z-index:80;padding-top:env(safe-area-inset-top,0px);transition:background .3s,border-color .3s;border-bottom:1px solid transparent}
.nav.on{background:var(--nav-bg);backdrop-filter:blur(12px);border-bottom-color:var(--line)}
.nav-in{max-width:var(--maxw);margin:0 auto;padding:16px 28px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{font-family:var(--mono);font-size:15px;font-weight:600}
.brand b{color:var(--accent);font-weight:600}
.nav-right{display:flex;align-items:center;gap:16px}
.nav-links{display:flex;gap:22px;align-items:center;list-style:none}
.nav-links a{font-family:var(--mono);font-size:13px;color:var(--muted);transition:color .2s;position:relative}
.nav-links a:hover,.nav-links a.active{color:var(--text)}
.nav-links a.active::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:1.5px;background:var(--accent)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex-shrink:0;animation:pulse 2.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(95,227,161,.45)}70%{box-shadow:0 0 0 7px rgba(95,227,161,0)}100%{box-shadow:0 0 0 0 rgba(95,227,161,0)}}
.ctl{display:flex;align-items:center;gap:8px}
.lang{font-family:var(--mono);font-size:12px;background:transparent;border:1px solid var(--line2);border-radius:8px;padding:6px 10px;cursor:pointer;color:var(--dim);display:flex;gap:5px;align-items:center}
.lang:hover{border-color:var(--accent)}
.lang b{font-weight:600;color:var(--dim)}
.lang b.on{color:var(--accent)}
.lang i{font-style:normal;color:var(--line2)}
.tgl{width:34px;height:34px;border-radius:8px;border:1px solid var(--line2);background:transparent;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center}
.tgl:hover{border-color:var(--accent);color:var(--accent)}
.tgl svg{width:17px;height:17px}
.tgl .sun{display:none}
html[data-theme="light"] .tgl .sun{display:block}
html[data-theme="light"] .tgl .moon{display:none}
.burger{display:none;background:none;border:none;cursor:pointer;padding:6px;color:var(--text)}
.burger span{display:block;width:22px;height:2px;background:currentColor;margin:5px 0}

/* hero */
.hero{min-height:100vh;display:flex;align-items:center;padding:120px 0 80px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;top:-10%;right:-5%;width:640px;height:640px;background:radial-gradient(circle,var(--glow),transparent 62%);pointer-events:none}
.hero-grid{position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:52px 52px;opacity:.35;-webkit-mask-image:radial-gradient(ellipse 80% 60% at 50% 35%,#000,transparent 78%);mask-image:radial-gradient(ellipse 80% 60% at 50% 35%,#000,transparent 78%);pointer-events:none}
.hero-in{display:grid;grid-template-columns:1fr 300px;gap:56px;align-items:center;position:relative;width:100%}
.hero h1{font-size:clamp(32px,5vw,56px);margin:6px 0 22px}
.hero .lead{color:var(--muted);font-size:18px;max-width:580px;margin-bottom:30px}
.status-chips{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:32px}
.stat-chip{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12.5px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 13px}
.stat-chip b{color:var(--text);font-weight:500}
.hero-cta{display:flex;gap:14px;flex-wrap:wrap}
.portrait{position:relative;border:1px solid var(--line2);border-radius:16px;overflow:hidden;background:var(--panel);box-shadow:0 30px 60px rgba(0,0,0,.28)}
.pbar{display:flex;align-items:center;gap:7px;padding:11px 14px;border-bottom:1px solid var(--line);background:var(--bg2)}
.pd{width:11px;height:11px;border-radius:50%}
.pd.r{background:#F5695B}.pd.y{background:#F5B944}.pd.g{background:var(--ok)}
.pf{margin-left:9px;font-family:var(--mono);font-size:11.5px;color:var(--dim)}
.pimg{position:relative}
.pimg img{width:100%;aspect-ratio:1/1.05;object-fit:cover}
.portrait .tag{position:absolute;left:14px;bottom:14px;display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11.5px;background:rgba(11,14,18,.72);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.14);border-radius:99px;padding:6px 12px;color:#fff}

/* about */
.about-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:60px;align-items:start}
.about-lead{font-family:var(--dsp);font-size:clamp(20px,2.4vw,26px);font-weight:500;line-height:1.4}
.about-body p{color:var(--muted);margin-top:18px}
.about-body p.about-lead{color:var(--text);margin-top:0}
.sec-head .eyebrow{font-family:var(--dsp);font-size:clamp(26px,3.6vw,38px);text-transform:none;letter-spacing:-.02em;color:var(--text);font-weight:600;margin-bottom:0}
.sec-head .eyebrow::before{color:var(--accent)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px}
.stat .num{font-family:var(--dsp);font-size:34px;font-weight:600}
.stat .lbl{font-family:var(--mono);font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:6px}

/* timeline */
.tl-item{display:grid;grid-template-columns:180px 1fr;gap:34px;padding-bottom:40px}
.tl-item:last-child{padding-bottom:0}
.tl-when{font-family:var(--mono);font-size:12.5px;color:var(--muted);padding-top:3px}
.tl-when.cur{color:var(--ok)}
.tl-body{position:relative;padding-left:28px;border-left:1px solid var(--line2)}
.tl-body::before{content:"";position:absolute;left:-5px;top:6px;width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--bg)}
.alt .tl-body::before{box-shadow:0 0 0 4px var(--bg2)}
.tl-body h3{font-size:19px}
.tl-body .co{font-family:var(--mono);font-size:13px;color:var(--accent);margin:6px 0 12px}
.tl-body ul{list-style:none}
.tl-body li{color:var(--muted);font-size:15px;padding-left:18px;position:relative;margin-bottom:7px}
.tl-body li::before{content:"\203A";position:absolute;left:0;color:var(--dim)}

/* projects */
.proj-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.proj{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;transition:transform .2s,border-color .2s}
.proj:hover{transform:translateY(-4px);border-color:var(--line2)}
.proj-cover{height:120px;position:relative;display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--line)}
.cov0{background:radial-gradient(120% 120% at 20% 10%,#3A1D12,#141A21)}
.cov1{background:radial-gradient(120% 120% at 20% 10%,#12233A,#141A21)}
.cov2{background:radial-gradient(120% 120% at 20% 10%,#123A2A,#141A21)}
.cov3{background:radial-gradient(120% 120% at 20% 10%,#2A1240,#141A21)}
.proj-cover svg{width:42px;height:42px;stroke:#38BDF8;fill:none;stroke-width:1.6}
.proj-cover .badge{position:absolute;top:12px;left:12px;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:#C9D1DB;background:rgba(11,14,18,.6);border:1px solid rgba(255,255,255,.12);border-radius:6px;padding:4px 9px;text-transform:uppercase}
.proj-b{padding:22px;display:flex;flex-direction:column;gap:11px;flex:1}
.proj-b h3{font-size:18px}
.proj-b p{color:var(--muted);font-size:14.5px;flex:1}
.ptags{display:flex;flex-wrap:wrap;gap:7px}
.ptag{font-family:var(--mono);font-size:11px;color:var(--muted);border:1px solid var(--line2);border-radius:6px;padding:3px 9px}
.plink{font-family:var(--mono);font-size:12.5px;color:var(--accent)}
.plink:hover{text-decoration:underline}

/* stack */
.tabs{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:26px}
.tab{font-family:var(--mono);font-size:12.5px;color:var(--muted);background:transparent;border:1px solid var(--line2);border-radius:8px;padding:8px 15px;cursor:pointer}
.tab:hover{border-color:var(--accent);color:var(--accent)}
.tab.is-on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:12px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:9px}
.chip img{width:34px;height:34px;object-fit:contain}
.chip span{font-family:var(--mono);font-size:11.5px;color:var(--muted);text-align:center}
.chip[hidden]{display:none}

/* certs */
.cert-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.cert{display:flex;gap:16px;padding:22px;border:1px solid var(--line);border-radius:16px;background:var(--panel);align-items:flex-start;transition:transform .2s,border-color .2s}
.cert:hover{transform:translateY(-3px);border-color:var(--accent)}
.cert-badge{width:52px;height:52px;border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#C74634,#7E241C)}
.cert-badge svg{width:28px;height:28px;fill:#fff}
.cert h4{font-family:var(--dsp);font-size:15.5px;font-weight:600;line-height:1.35;margin-bottom:7px}
.cert .m{font-family:var(--mono);font-size:12px;color:var(--muted);margin-bottom:10px}
.cert .m b{color:var(--oracle);font-weight:500}
.cert .view{font-family:var(--mono);font-size:12px;color:var(--accent)}

/* education + languages */
.edu-list{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.edu{border:1px solid var(--line);border-radius:14px;padding:20px;background:var(--panel)}
.edu .yr{font-family:var(--mono);font-size:11.5px;color:var(--accent);margin-bottom:8px}
.edu h4{font-family:var(--dsp);font-size:16px;font-weight:600;margin-bottom:5px}
.edu .sc{font-size:13.5px;color:var(--muted)}
.langs-h{font-family:var(--dsp);font-size:22px;margin:48px 0 18px}
.lang-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.lg{border:1px solid var(--line);border-radius:12px;padding:16px;background:var(--panel)}
.lg b{font-family:var(--dsp);font-size:16px;display:block}
.lg span{font-family:var(--mono);font-size:12px;color:var(--muted)}

/* contact */
.contact{background:linear-gradient(180deg,var(--bg),var(--bg2))}
.contact-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:52px;align-items:start}
.contact-big{font-family:var(--dsp);font-size:clamp(30px,5vw,52px);font-weight:600;line-height:1.1;margin-bottom:16px}
.contact-sub{color:var(--muted);max-width:520px}
.contact-rows{display:grid;gap:12px;margin-top:30px}
.crow{display:flex;align-items:center;gap:14px;padding:14px 18px;border:1px solid var(--line);border-radius:12px;background:var(--panel);transition:border-color .18s}
.crow:hover{border-color:var(--accent)}
.crow .k{font-family:var(--mono);font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;display:block}
.crow .v{font-size:14.5px;word-break:break-word}
.cform-head{font-family:var(--mono);font-size:11.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;margin-bottom:14px}
.cform{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:26px}
.cform-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}
.field label,.field .lbl{font-family:var(--mono);font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
.req{color:var(--accent)}
.field input,.field textarea{width:100%;background:var(--bg2);border:1px solid var(--line2);border-radius:10px;padding:12px 14px;color:var(--text);font-family:var(--body);font-size:15px}
.field textarea{min-height:118px;resize:vertical}
.field input::placeholder,.field textarea::placeholder{color:var(--dim)}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--glow)}
.filebox{display:flex;align-items:center;gap:11px;background:var(--bg2);border:1px dashed var(--line2);border-radius:10px;padding:12px 14px;cursor:pointer;font-family:var(--mono);font-size:12.5px;color:var(--dim)}
.filebox:hover,.filebox.has{border-color:var(--accent);color:var(--text)}
.filebox input{position:absolute;width:1px;height:1px;opacity:0}
.cform .btn{width:100%;justify-content:center}
.cform .btn[disabled]{opacity:.6;cursor:wait}
.cform-status{font-family:var(--mono);font-size:12.5px;margin-top:12px;min-height:16px}
.cform-status.ok{color:var(--ok)}.cform-status.err{color:#F5695B}
.hp{position:absolute;left:-9999px}

footer{border-top:1px solid var(--line);padding:30px 0}
.foot-in{max-width:var(--maxw);margin:0 auto;padding:0 28px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;font-family:var(--mono);font-size:13px;color:var(--muted)}
.foot-soc{display:flex;gap:16px}
.foot-soc a:hover{color:var(--accent)}

.rev{opacity:0;transform:translateY(18px);transition:opacity .6s,transform .6s}
.rev.in{opacity:1;transform:none}
.no-js .rev{opacity:1;transform:none}

@media (max-width:1060px){
  .nav-links{gap:16px}
}
@media (max-width:900px){
  .hero-in{grid-template-columns:1fr;gap:40px} .portrait{max-width:280px}
  .about-grid,.contact-grid{grid-template-columns:1fr;gap:40px}
  .proj-grid,.cert-grid,.edu-list{grid-template-columns:1fr}
  .lang-grid{grid-template-columns:1fr 1fr}
  .tl-item{grid-template-columns:1fr;gap:8px}
  section{padding:80px 0}
}
@media (max-width:980px){
  .nav-links{position:fixed;top:calc(62px + env(safe-area-inset-top,0px));right:0;left:0;background:var(--nav-bg);backdrop-filter:blur(12px);flex-direction:column;align-items:flex-start;padding:24px 28px;gap:18px;border-bottom:1px solid var(--line);transform:translateY(-140%);transition:transform .3s;visibility:hidden}
  .nav-links.open{transform:none;visibility:visible}
  .burger{display:block}
}
@media (max-width:560px){.cform-row{grid-template-columns:1fr}.wrap{padding:0 20px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}html{scroll-behavior:auto}.rev{opacity:1;transform:none}}
</style>
</head>
<body>

<nav class="nav" id="nav">
  <div class="nav-in">
    <a class="brand" href="#home">issam<b>.serbout</b></a>
    <div class="nav-right">
      <ul class="nav-links" id="navLinks"></ul>
      <div class="ctl">
        <button class="lang" id="langBtn" type="button"><b data-l="en">EN</b><i>·</i><b data-l="es">ES</b></button>
        <button class="tgl" id="themeBtn" type="button">
          <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke-linecap="round"/></svg>
        </button>
      </div>
      <button class="burger" id="burger" type="button" aria-label="Menu" aria-expanded="false"><span></span><span></span><span></span></button>
    </div>
  </div>
</nav>

<header class="hero" id="home">
  <div class="hero-grid"></div>
  <div class="wrap hero-in">
    <div>
      <div class="eyebrow" data-t="role"></div>
      <h1 data-t="heroTitle"></h1>
      <p class="lead" data-t="heroLead"></p>
      <div class="status-chips">
        <span class="stat-chip"><span class="dot"></span><b data-t="avail"></b></span>
        <span class="stat-chip">Java · C# · Python</span>
        <span class="stat-chip">Angular · React · Vue</span>
      </div>
      <div class="hero-cta">
        <a class="btn btn-a" id="cvLink" download><span data-t="cv"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0 4-4m-4 4-4-4M4 21h16" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
        <a class="btn btn-b" href="#contact" data-t="talk"></a>
      </div>

/* tiny syntax highlighter */
function hl(code, lang){
  const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const KW = {
    java:"public|private|final|class|return|new|void|static|import",
    csharp:"public|private|class|async|await|return|is|new|string|var",
    python:"async|def|await|if|is|None|raise|return|from|import",
    ts:"export|class|private|const|let|return|new|import",
    js:"export|function|const|let|return|async|await|null|new|import",
    sql:"SELECT|FROM|WHERE|ORDER|BY|IS|NOT|NULL|DESC|CREATE|INDEX|ON|ALTER|TABLE|ADD|CONSTRAINT|FOREIGN|KEY|REFERENCES|AND|OR"
  }[lang] || "";
  const parts = [
    "(--[^\\n]*|//[^\\n]*|#[^\\n]*)",
    "(\"(?:[^\"\\\\]|\\\\.)*\"|'(?:[^'\\\\]|\\\\.)*'|`(?:[^`\\\\]|\\\\.)*`)",
    "(@\\w+|\\[\\w+(?=[\\](]))",
    "\\b(" + KW + ")\\b",
    "\\b([A-Z][A-Za-z0-9]+)\\b"
  ];
  if (lang !== 'python') parts[0] = "(--[^\\n]*|//[^\\n]*)";
  if (lang === 'sql') parts[4] = "(\\$NEVER\\$)";
  const re = new RegExp(parts.join("|"), "g");
  let out = "", last = 0, m;
  while ((m = re.exec(code))) {
    out += esc(code.slice(last, m.index));
    const cls = m[1]?"c":m[2]?"s":m[3]?"a":m[4]?"k":"t";
    out += '<span class="tk-'+cls+'">'+esc(m[0])+'</span>';
    last = re.lastIndex;
  }
  return out + esc(code.slice(last));
}

  ['sys','Linux','linux/linux-original'],['sys','Bash','bash/bash-original'],['sys','PowerShell','powershell/powershell-original'],['sys','Kotlin','kotlin/kotlin-original'],['sys','Scala','scala/scala-original'],['sys','C++','cplusplus/cplusplus-original'],['sys','PHP','php/php-original'],['sys','R','r/r-original']
];
const TABS = {en:{back:'Back-end',front:'Front-end',db:'Databases',ops:'Cloud & DevOps',sys:'Systems & other',all:'All'},
              es:{back:'Back-end',front:'Front-end',db:'Bases de datos',ops:'Cloud y DevOps',sys:'Sistemas y otros',all:'Todo'}};
const BIG = {en:"Let's build something reliable.", es:"Construyamos algo fiable."};
const SECTIONS = ['about','work','projects','stack','certs','education','contact'];
const NAVKEY = {about:'about',work:'work',projects:'projects',stack:'stack',certs:'certs',education:'edu',contact:'contact'};
const ICONS = ['<path d="M3 12h4l2-6 4 12 2-6h6" stroke-linecap="round" stroke-linejoin="round"/>',
  '<path d="M4 19V9l8-5 8 5v10M9 19v-6h6v6M2 19h20" stroke-linecap="round" stroke-linejoin="round"/>',
  '<path d="M13 2 4 14h6l-1 8 9-12h-6l1-8z" stroke-linecap="round" stroke-linejoin="round"/>',
  '<path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.3h6c0-1 .4-1.8 1-2.3A7 7 0 0 0 12 2zM9 20h6M10 22h4" stroke-linecap="round" stroke-linejoin="round"/>'];
let lang = 'en', cat = 'back';
try { const s = localStorage.getItem('lang'); if (s === 'es' || s === 'en') lang = s; } catch(e) {}

function render(){
  const t = D[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-t]').forEach(el => el.textContent = t[el.dataset.t]);
  document.querySelectorAll('[data-f]').forEach(el => el.textContent = t.form[el.dataset.f]);
  document.querySelectorAll('[data-p]').forEach(el => el.placeholder = t.form[el.dataset.p]);
  document.querySelector('.contact-big').textContent = BIG[lang];
  document.querySelectorAll('#langBtn b').forEach(b => b.classList.toggle('on', b.dataset.l === lang));
  $('#langBtn').setAttribute('aria-label', t.langLabel); $('#themeBtn').setAttribute('aria-label', t.themeLabel);
  $('#navLinks').innerHTML = SECTIONS.map(id => `<li><a href="#${id}">${t.nav[NAVKEY[id]]}</a></li>`).join('');
  $('#aboutBody').innerHTML = `<p class="about-lead">${esc(t.about[0])}</p>` + t.about.slice(1).map(p => `<p>${esc(p)}</p>`).join('');
  $('#stats').innerHTML = t.stats.map(([n,l]) => `<div class="stat"><div class="num">${n}</div><div class="lbl">${esc(l)}</div></div>`).join('');
  $('#timeline').innerHTML = t.work.map(j => `<div class="tl-item rev in"><div class="tl-when${j.cur?' cur':''}">${esc(j.when)}</div><div class="tl-body"><h3>${esc(j.role)}</h3><div class="co">${esc(j.co)}</div><ul>${j.items.map(i=>`<li>${esc(i)}</li>`).join('')}</ul></div></div>`).join('');
  $('#projGrid').innerHTML = t.projects.map((p,i) => `<article class="proj"><div class="proj-cover cov${i}"><span class="badge">${esc(p.kind)}</span><svg viewBox="0 0 24 24">${ICONS[i]}</svg></div><div class="proj-b"><h3>${esc(p.name)}</h3><p>${esc(p.text)}</p><div class="ptags">${p.tags.map(g=>`<span class="ptag">${esc(g)}</span>`).join('')}</div>${p.link?`<a class="plink" href="${p.link}" target="_blank" rel="noopener">${t.codeLink}</a>`:''}</div></article>`).join('');
  const seal = '<svg viewBox="0 0 24 24"><path d="M12 2 4 6v6c0 3.5 2.7 6.7 8 8 5.3-1.3 8-4.5 8-8V6l-8-4zm-1.2 12.5-2.9-2.9 1.4-1.4 1.5 1.5 3.9-3.9 1.4 1.4-5.3 5.3z"/></svg>';
  $('#certGrid').innerHTML = t.certs.map(c => `<a class="cert" href="${c.file}" target="_blank" rel="noopener"><div class="cert-badge">${seal}</div><div><h4>${esc(c.name)}</h4><div class="m"><b>Oracle Certified Professional</b><br>Oracle University, ${esc(c.date)}</div><span class="view">${t.certView}</span></div></a>`).join('');
  $('#eduList').innerHTML = t.edu.map(e => `<div class="edu"><div class="yr">${esc(e.yr)}</div><h4>${esc(e.name)}</h4><div class="sc">${esc(e.sc)}</div></div>`).join('');
  $('#langGrid').innerHTML = t.langs.map(([a,b]) => `<div class="lg"><b>${esc(a)}</b><span>${esc(b)}</span></div>`).join('');
  const L = t.labels;
  $('#crows').innerHTML = [[L.email,CONTACT.email,'mailto:'+CONTACT.email],[L.phone,CONTACT.phone,'tel:'+CONTACT.tel],[L.whatsapp,CONTACT.phone,CONTACT.whatsapp],[L.linkedin,'Issam Serbout',CONTACT.linkedin],[L.github,'github.com/issamserbout',CONTACT.github]]
    .map(([k,v,h]) => `<a class="crow" href="${h}"${h.startsWith('http')?' target="_blank" rel="noopener"':''}><span><span class="k">${k}</span><span class="v">${esc(v)}</span></span></a>`).join('');
  renderStack();
}

function renderStack(){
  const T = TABS[lang];
  const count = c => c === 'all' ? CHIPS.length : CHIPS.filter(x => x[0] === c).length;
  $('#tabs').innerHTML = Object.keys(T).map(c => `<button type="button" class="tab${c===cat?' is-on':''}" data-cat="${c}">${T[c]} <span style="opacity:.6">${count(c)}</span></button>`).join('');
  $('#chips').innerHTML = CHIPS.map(([c,n,p]) => `<div class="chip"${cat!=='all'&&c!==cat?' hidden':''}><img src="${DEV}${p}.svg" alt="" loading="lazy" onerror="this.style.visibility='hidden'"><span>${n}</span></div>`).join('');
}

$('#tabs').addEventListener('click', e => { const b = e.target.closest('[data-cat]'); if (!b) return; cat = b.dataset.cat; renderStack(); });
$('#langBtn').addEventListener('click', () => { lang = lang === 'en' ? 'es' : 'en'; try { localStorage.setItem('lang', lang); } catch(e) {} render(); });

/* theme */
try { const th = localStorage.getItem('theme'); if (th) document.documentElement.setAttribute('data-theme', th); } catch(e) {}
$('#themeBtn').addEventListener('click', () => {
  const next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', next); try { localStorage.setItem('theme', next); } catch(e) {}
});

/* nav */
const nav = $('#nav'), burger = $('#burger'), links = $('#navLinks');
addEventListener('scroll', () => nav.classList.toggle('on', scrollY > 30), {passive:true});
burger.addEventListener('click', () => { const o = links.classList.toggle('open'); burger.setAttribute('aria-expanded', o); });
links.addEventListener('click', e => { if (e.target.closest('a')) { links.classList.remove('open'); burger.setAttribute('aria-expanded', false); } });
addEventListener('scroll', () => {
  const y = scrollY + 140; let cur = '';
  SECTIONS.forEach(id => { const s = document.getElementById(id); if (s.offsetTop <= y) cur = id; });
  links.querySelectorAll('a').forEach(a => a.classList.toggle('active', a.getAttribute('href') === '#'+cur));
}, {passive:true});

$('#cvLink').href = CONTACT.cv;
$('#fGit').href = CONTACT.github; $('#fIn').href = CONTACT.linkedin; $('#fWa').href = CONTACT.whatsapp;

/* form */
const form = $('#cform'), status = $('#status'), fileIn = $('#fileIn');
if (new URLSearchParams(location.search).get('sent') === '1') {
  status.className = 'cform-status ok'; status.textContent = D[lang].form.sent;
  history.replaceState(null, '', location.pathname + '#contact');
}
fileIn.addEventListener('change', () => {
  const f = fileIn.files[0], box = $('#fileBox'), txt = $('#fileTxt'), F = D[lang].form;
  box.classList.remove('has'); status.className = 'cform-status'; status.textContent = '';
  if (!f) { txt.textContent = F.filePh; return; }
  const ext = (f.name.split('.').pop() || '').toLowerCase();
  const bad = !['pdf','doc','docx','png','jpg','jpeg','txt','zip'].includes(ext) ? F.badType : f.size > 10*1024*1024 ? F.tooBig : '';
  if (bad) { status.className = 'cform-status err'; status.textContent = bad; fileIn.value = ''; txt.textContent = F.filePh; return; }
  box.classList.add('has'); txt.textContent = f.name + ' (' + (f.size/1048576).toFixed(1) + ' MB)';
});
form.addEventListener('submit', e => {
  if (form._honey.value) { e.preventDefault(); return; }
  if (!form.checkValidity()) { e.preventDefault(); form.reportValidity(); return; }
  const b = $('#sendBtn'); b.disabled = true; b.textContent = D[lang].form.sending;
});

render();

/* reveal on scroll */
const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), {threshold:.12});
document.querySelectorAll('.rev:not(.in)').forEach(el => io.observe(el));
</script>
</body>
</html>
